# Pilot configuration for aforo-vision.
# Real secrets and production URLs do NOT go here (see AGENTS.md):
#   AFORO_BACKEND_URL           Supabase project URL (overrides backend.url)
#   AFORO_CAMERA_OUTSIDE_SOURCE overrides the camera-outside source (RTSP URL with credentials)
#   AFORO_CAMERA_INSIDE_SOURCE  overrides the camera-inside source
#   AFORO_SUPABASE_KEY          publishable key, sent in the apikey header
#   AFORO_DEVICE_KEY            per-classroom key, sent in the X-Device-Key header
# Thresholds below are starting points; tune them after the rehearsal (task 8.3).

cameras:
  # Both cameras run the same pipeline (AGENTS.md rule 3).
  # source: USB index (int) or stream URL (str).
  camera-outside:
    source: "rtsp://USER:PASSWORD@192.168.43.100:554/stream1"
  camera-inside:
    source: 0

capture:
  reconnect_interval_seconds: 5.0  # retry period when a camera is unavailable or drops

detection:
  model: yolo26n-pose.pt
  backend: torch                        # torch (default, needs torch/ultralytics) | onnx (requirements-slim.txt, sin torch)
  onnx_model: models/yolo26n-pose.onnx  # solo se usa con backend: onnx (python -m tools.export_yolo_onnx)
  confidence_threshold: 0.5

tracking:
  iou_threshold: 0.3        # min IoU to associate a detection with a track
  max_age_frames: 30        # frames a track survives without a detection
  min_hits: 3               # detections before a track is considered confirmed
  trajectory_length: 30     # size of the per-track deque (task 3.4)

identity:
  face_similarity_threshold: 0.45   # cosine similarity, periocular ArcFace embedding
  body_similarity_threshold: 0.60   # cosine similarity, OSNet embedding

matching:
  time_window_seconds: 5.0  # max gap between outside and inside sightings of one crossing

dedup:
  ttl_seconds: 10.0

backend:
  url: "https://your-project-ref.supabase.co"  # placeholder: the real URL goes in AFORO_BACKEND_URL
  timeout_seconds: 5.0
  retry_queue_path: data/retry_queue.sqlite

# Modo ahorro: solo se procesa con YOLO cuando hay movimiento en la ROI (README: «Modo ahorro (movimiento)»).
# Apagado por defecto: no esta validado con camara real. Calibra con: python -m tools.motion_preview
motion:
  enabled: false
  hold_seconds: 8.0       # tras el ultimo movimiento sigue procesando este tiempo
  idle_fps: 4.0           # sin movimiento solo se revisa la imagen este numero de veces por segundo
  pixel_threshold: 25     # cambio de gris (0-255) para contar un pixel como "en movimiento"
  min_area: 0.01          # fraccion de la ROI que debe cambiar para activar
  warmup_seconds: 3.0     # margen extra de procesamiento tras activarse
  # ROI = [x1, y1, x2, y2] en fracciones 0-1 de la imagen. Elige SOLO el marco de la puerta y el pasillo
  # inmediato. NO incluyas el interior del salon: la camara de adentro ve gente moviendose siempre y el
  # modo ahorro nunca se apagaria. Un track vivo dentro de la ROI tambien mantiene el procesamiento.
  roi:
    camera-outside: [0.0, 0.0, 1.0, 1.0]
    camera-inside: [0.0, 0.0, 1.0, 1.0]   # cambia esto (ej. [0.3, 0.1, 0.8, 1.0]) antes de activar
